<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ</title>
</head>

<body>
    <div class="faq-container">
        <div class="faq-item">
            <button class="question">Məhsulu necə sifariş edə bilərəm?</button>
            <p class="answer">Saytımızdan qeydiyyatdan keçərək sifariş edə bilərsiniz.</p>
        </div>

        <div class="faq-item">
            <button class="question">Çatdırılma neçə gün çəkir?</button>
            <p class="answer">Çatdırılma adətən 2-3 iş günü ərzində həyata keçirilir.</p>
        </div>

        <div class="faq-item">
            <button class="question">Sifarişi ləğv edə bilərəm?</button>
            <p class="answer">Bəli, məhsul kuryerə verilməmişdən əvvəl ləğv edə bilərsiniz.</p>
        </div>
    </div>
</body>

</html>
